[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-ml"
version = "0.1.0"
description = "SentinelMesh ML layer: versioned feature schemas + deterministic extractors, preprocessing, the anomaly-model interface, and a statistical detector (always available). Trained models (Isolation Forest, autoencoder) load from artifacts and are served by ml-inference."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
]

[project.optional-dependencies]
# `ml-inference` installs this; the statistical detector and feature layer need none of it.
serving = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_ml"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
