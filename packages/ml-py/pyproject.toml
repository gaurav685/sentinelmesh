[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-ml"
version = "0.1.0"
description = "SentinelMesh ML layer: versioned feature + graph-feature schemas with deterministic extractors, preprocessing, the anomaly-model + graph-model interfaces, always-available statistical + structural-graph detectors, and the GNN boundary (GraphSAGE / GAT, optional sm-ml[gnn]). Trained models load from artifacts and are served by ml-inference. No accuracy figure is claimed anywhere."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
]

[project.optional-dependencies]
# `ml-inference` installs this; the statistical detector and feature layer need none of it.
serving = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3",
]
# GNN training + serving (`ml-training`, `ml-inference` graph models). Heavy;
# not installed in CI. Without it the structural graph models are the only path.
gnn = [
    "torch>=2.2,<3",
    "torch-geometric>=2.5,<3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_ml"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
