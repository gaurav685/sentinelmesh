[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-common"
version = "0.1.0"
description = "SentinelMesh shared platform primitives: config, logging, errors, IDs, security, health, FastAPI wiring. No business logic."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.27",
    "anyio>=4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29",
    "redis>=5,<6",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_common"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
