; Alembic configuration for the SentinelMesh PostgreSQL schema.
;
; The database URL is NOT set here — `env.py` builds it from the validated
; `AppSettings` (SM_PG_* environment variables) so migrations and services can
; never point at different databases by accident, and no credential lands in a
; committed file.
;
; Usage (from the repository root):
;   alembic -c migrations/postgres/alembic.ini upgrade head
;   alembic -c migrations/postgres/alembic.ini downgrade -1
;   alembic -c migrations/postgres/alembic.ini current

[alembic]
script_location = %(here)s
prepend_sys_path = .
version_path_separator = os
version_locations = %(here)s/versions
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
