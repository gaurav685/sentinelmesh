# Root workspace configuration for all Python packages/services in SentinelMesh.
# Individual services/packages carry their own pyproject.toml with dependencies;
# this root file centralizes tooling (lint, type-check, test) configuration only.
#
# Phase 0: no runtime dependencies are declared yet. Phase 1 introduces the first
# service dependency sets and a lockfile.

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["packages", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC", "DTZ", "T20", "RUF"]
# S = flake8-bandit (security), ASYNC = async pitfalls, DTZ = naive datetime,
# T20 = no stray print. These enforce Engineering Constitution sections 5/7/11.
ignore = ["S101"]  # assert allowed in tests only; see per-path override below

[tool.ruff.lint.isort]
known-first-party = ["sm_contracts", "sm_common", "sm_api_gateway", "sm_ingestion_gateway", "sm_normalization_engine", "sm_stream_processor", "sm_graph_service"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's declarative dependency style requires these calls in defaults (B008).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    # Our own dependency factories follow the same declarative pattern.
    "sm_api_gateway.deps.require_permission",
    "require_permission",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"**/tests/**" = ["S101", "S105", "S106"]
# scripts are CLI tools: printing to stdout and invoking pinned local tools is intended.
"scripts/**" = ["T201", "S603", "S607"]
# Domain exception names read better without an "Error" suffix at call sites
# (`raise NotFound()`, `raise TenantForbidden()`); the module is clearly errors.
"**/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# `disallow_any_explicit` is intentionally NOT enabled: open annotation maps
# (`metadata`, `settings`) are `dict[str, Any]` by design — non-authoritative
# JSON validated at trust boundaries, not in the type system.
plugins = ["pydantic.mypy"]
mypy_path = "packages/contracts-py/src:packages/common-py/src"

[[tool.mypy.overrides]]
# aiokafka ships no py.typed marker / stubs.
module = "aiokafka.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests", "packages", "services"]
markers = [
    "unit: fast, no external infrastructure",
    "integration: requires docker-compose infrastructure",
    "contract: cross-service contract verification",
    "security: authz / tenant-isolation / injection tests",
    "e2e: full stack",
]

[tool.coverage.run]
branch = true
source = ["packages", "services"]
