{{/*
Secret strategy (ADR-021): default is External Secrets Operator pulling
from a real Vault/cloud-KMS SecretStore -- no secret value is ever
hardcoded in this chart. secretsProvider=manual exists ONLY for a local
kind-cluster smoke test and renders a plain Secret from
.Values.secrets, which defaults to {} (empty) so nothing ships with a
real credential baked in.

The same secret set is rendered into every namespace that has a real
consumer: `app` (the 14 services) and `data` (postgres/neo4j/redis/minio
reading their own bootstrap credential, e.g. postgres reading
SM_PG_PASSWORD to set its own superuser password). Secrets are
namespace-scoped in Kubernetes, so one object per namespace is required
-- this is not duplication of intent, just of the object.
*/}}
{{- $namespaces := list .Values.global.namespaces.app .Values.global.namespaces.data }}
{{- range $namespaces }}
{{- $ns := . }}
---
{{- if eq $.Values.global.secretsProvider "eso" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sentinelmesh-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "sentinelmesh.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.global.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.global.externalSecret.secretStoreRef.name }}
    kind: {{ $.Values.global.externalSecret.secretStoreRef.kind }}
  target:
    name: sentinelmesh-secrets
    creationPolicy: Owner
  data:
    {{- range $.Values.global.secretKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: sentinelmesh/{{ . }}
    {{- end }}
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: sentinelmesh-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "sentinelmesh.labels" $ | nindent 4 }}
  annotations:
    sentinelmesh.io/warning: >-
      secretsProvider=manual -- dev/kind smoke-test only. Populate real
      values via --set-string secrets.<KEY>=... at install time. Never
      commit real values into values files.
type: Opaque
stringData:
  {{- range $.Values.global.secretKeys }}
  {{ . }}: {{ (get ($.Values.secrets | default dict) .) | default "" | quote }}
  {{- end }}
{{- end }}
{{- end }}
