{{- if .Values.podDisruptionBudget.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if ge ($svc.replicas | int) 2 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sm-{{ $name }}
  namespace: {{ $.Values.global.namespaces.app }}
  labels:
    {{- include "sentinelmesh.serviceLabels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
---
{{- end }}
{{- end }}
{{- if and .Values.frontend.enabled (ge (.Values.frontend.replicas | int) 2) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sm-frontend
  namespace: {{ .Values.global.namespaces.app }}
  labels:
    {{- include "sentinelmesh.serviceLabels" (dict "name" "frontend" "root" $) | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
{{- end }}
{{- end }}
