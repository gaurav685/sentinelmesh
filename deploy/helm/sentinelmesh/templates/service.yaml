{{- range $name, $svc := .Values.services }}
apiVersion: v1
kind: Service
metadata:
  name: sm-{{ $name }}
  namespace: {{ $.Values.global.namespaces.app }}
  labels:
    {{- include "sentinelmesh.serviceLabels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
---
{{- end }}
{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: sm-frontend
  namespace: {{ .Values.global.namespaces.app }}
  labels:
    {{- include "sentinelmesh.serviceLabels" (dict "name" "frontend" "root" $) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
{{- end }}
