{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.global.namespaces.data }}
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.global.namespaces.data }}
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        # NOT runAsNonRoot: the official postgres-derived entrypoint
        # (pgvector/pgvector extends postgres:16) starts as root
        # specifically to chown/initialize PGDATA on a fresh volume, then
        # drops privilege to the postgres user itself via gosu before
        # postgres ever runs -- this is upstream's own documented
        # mechanism, verified against the real image on this cluster
        # (forcing runAsNonRoot:true here fails with "container has
        # runAsNonRoot and image will run as root"). The container-level
        # capability set below is trimmed to exactly what that startup
        # step needs, not left at the root default.
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER"]
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: sentinelmesh-secrets
          env:
            - name: POSTGRES_DB
              value: sentinelmesh
            - name: POSTGRES_USER
              value: sentinelmesh
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinelmesh-secrets
                  key: SM_PG_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sentinelmesh"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "sentinelmesh"]
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
