# SentinelMesh local infrastructure.
#
# Run from the repository root:
#   docker compose -f deploy/docker/docker-compose.yml up -d
#
# Container-to-container addressing uses **service names**, never localhost.
# The values in `.env` target a developer's host (localhost) for running the app
# outside Docker; the `environment:` blocks below override the host-facing ones
# so the same `.env` works in both places.
#
# Profiles keep the default stack small:
#   (default)        postgres, redis, migrate, app, ingestion-gateway
#   --profile oidc   keycloak
#   --profile obs    prometheus, grafana
#   --profile graph  neo4j, graph-service   (Phase 4+; graph-service also needs --profile bus)
#   --profile bus    redpanda         (Phase 2+)
#   --profile detect ml-inference, detection-engine, mitre-service, threat-intel-service, correlation-engine   (Phase 5-7; detection/mitre/correlation also need --profile bus)
#   --profile objects minio           (Phase 5+)

name: sentinelmesh

x-app-env: &app-env
  # Service-name addressing for everything inside the compose network.
  SM_PG_HOST: postgres
  SM_PG_PORT: "5432"
  SM_REDIS_URL: redis://redis:6379/0
  # Internal-network address -- reachable from inside the compose network for
  # fetching Keycloak's discovery document and JWKS. This is NOT what a
  # browser sees for the login redirect: Keycloak's own KC_HOSTNAME setting
  # (below) makes it advertise http://localhost:8080/... as its
  # authorization_endpoint in that same discovery document, which is what
  # the browser actually gets redirected to. Pointing this at localhost
  # instead would break every service's *internal* token/JWKS validation
  # (localhost inside a container is that container, not Keycloak) to fix a
  # browser-facing problem that KC_HOSTNAME already solves correctly.
  SM_OIDC_ISSUER: http://keycloak:8080/realms/sentinelmesh
  SM_NEO4J_URI: bolt://neo4j:7687
  SM_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  SM_S3_ENDPOINT: http://minio:9000
  SM_OTEL_EXPORTER_OTLP_ENDPOINT: ""
  SM_SESSION_COOKIE_SECURE: "false"
  SM_CORS_ALLOWED_ORIGINS: http://localhost:3000

services:
  postgres:
    # pgvector/pgvector:pg16 = upstream postgres:16 + the pgvector extension
    # preinstalled (ADR-006) — memory-service's campaign/fingerprint similarity
    # search needs `CREATE EXTENSION vector` to succeed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${SM_PG_DB:-sentinelmesh}
      POSTGRES_USER: ${SM_PG_USER:-sentinelmesh}
      POSTGRES_PASSWORD: ${SM_PG_PASSWORD:?SM_PG_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SM_PG_USER:-sentinelmesh} -d ${SM_PG_DB:-sentinelmesh}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: brings the schema to head, then exits. `app` waits for it to
  # succeed, so the service never starts against an older schema.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: migrations
    command:
      ["alembic", "-c", "/app/migrations/postgres/alembic.ini", "upgrade", "head"]
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: api-gateway
      SM_DEPLOYMENT_PROFILE: monolith
      # BFF proxy targets — the api-gateway container talks to every other
      # service by its compose service name, never `localhost` (that would
      # resolve to the api-gateway container itself).
      SM_CORRELATION_ENGINE_URL: http://correlation-engine:8009
      SM_GRAPH_SERVICE_URL: http://graph-service:8004
      SM_TI_SERVICE_URL: http://threat-intel-service:8007
      SM_MITRE_SERVICE_URL: http://mitre-service:8008
      SM_AI_ANALYST_URL: http://ai-analyst:8010
      SM_SIMULATION_SERVICE_URL: http://simulation-service:8011
      SM_MEMORY_SERVICE_URL: http://memory-service:8012
      SM_REPORTING_SERVICE_URL: http://reporting-service:8013
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingestion-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_ingestion_gateway"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: ingestion-gateway
      SM_DEPLOYMENT_PROFILE: monolith
      # Off by default so the gateway runs without the `bus` profile. Set
      # SM_EVENT_BUS_ENABLED=true in .env (with `--profile bus`) to produce to
      # `telemetry.raw`; the in-network address is redpanda:9092 (x-app-env).
      SM_EVENT_BUS_ENABLED: ${SM_EVENT_BUS_ENABLED:-false}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Stream processor: telemetry.raw -> events.canonical. Needs the `bus` profile
  # (Redpanda), so it only starts when that profile is active.
  # One-shot: create the topic catalog with the right partition counts before
  # any producer/consumer starts (Redpanda auto-create would give 1 partition).
  topics-init:
    profiles: ["bus"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "scripts/provision_topics.py"]
    working_dir: /app
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: topics-init
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy

  normalization-engine:
    profiles: ["bus"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_normalization_engine"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: normalization-engine
      SM_DEPLOYMENT_PROFILE: monolith
      SM_EVENT_BUS_ENABLED: "true"
      SM_KAFKA_CONSUMER_GROUP: normalization
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      redpanda:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully

  stream-processor:
    profiles: ["bus"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_stream_processor"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: stream-processor
      SM_DEPLOYMENT_PROFILE: monolith
      SM_EVENT_BUS_ENABLED: "true"
      SM_KAFKA_CONSUMER_GROUP: stream-processor
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8003/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      redpanda:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully

  # The only write path into Neo4j. Consumes graph.commands, emits graph.events.
  # Needs BOTH the bus and the graph store — run with `--profile bus --profile graph`.
  graph-service:
    profiles: ["graph"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_graph_service"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: graph-service
      SM_DEPLOYMENT_PROFILE: monolith
      SM_EVENT_BUS_ENABLED: "true"
      SM_KAFKA_CONSUMER_GROUP: graph-writer
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8004/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      neo4j:
        condition: service_healthy

  # Model serving (ADR-013). No trained artifacts ship in the repo, so every
  # infer call returns MODEL_UNAVAILABLE until ml-training produces one.
  ml-inference:
    profiles: ["detect"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_ml_inference"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: ml-inference
      SM_DEPLOYMENT_PROFILE: monolith
      SM_ML_MODEL_DIR: /app/ml/artifacts
    volumes:
      # Trained artifacts (packages/ml-py/src/sm_ml/registry) are runtime
      # data, not baked into the image -- mounted read-only so a locally
      # trained model (scripts/train_isolation_forest_network_flow.py)
      # is visible without a rebuild.
      - ../../ml/artifacts:/app/ml/artifacts:ro
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8005/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  # telemetry -> features -> anomaly -> evidence -> detection -> alert (reqs 5, 8).
  # Needs the bus, Postgres and (optionally) ml-inference:
  #   --profile bus --profile detect
  detection-engine:
    profiles: ["detect"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_detection_engine"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: detection-engine
      SM_DEPLOYMENT_PROFILE: monolith
      SM_EVENT_BUS_ENABLED: "true"
      SM_KAFKA_CONSUMER_GROUP: detection
      SM_ML_INFERENCE_URL: http://ml-inference:8005
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8006/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ATT&CK catalog + technique mapping (req 7). Catalog imported offline:
  #   python scripts/import_attack_stix.py --bundle <bundle> --version <v>
  mitre-service:
    profiles: ["detect"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_mitre_service"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: mitre-service
      SM_DEPLOYMENT_PROFILE: monolith
      SM_EVENT_BUS_ENABLED: "true"
      SM_KAFKA_CONSUMER_GROUP: mitre-mapping
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8008/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # IOC store + enrichment (req 9). Provider adapters are feature-flagged off.
  threat-intel-service:
    profiles: ["detect"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_ti_service"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: threat-intel-service
      SM_DEPLOYMENT_PROFILE: monolith
      SM_EVENT_BUS_ENABLED: "true"
    ports:
      - "8007:8007"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8007/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Attack-chain reconstruction + threat scoring (req 6, req 8). Consumes
  # `detections`, produces `attack_chains`. Also needs --profile bus for Redpanda.
  correlation-engine:
    profiles: ["detect"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_correlation_engine"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: correlation-engine
      SM_DEPLOYMENT_PROFILE: monolith
      SM_EVENT_BUS_ENABLED: "true"
      SM_KAFKA_CONSUMER_GROUP: correlation
    ports:
      - "8009:8009"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8009/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ai-analyst:
    profiles: ["detect"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_ai_analyst"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: ai-analyst
      SM_DEPLOYMENT_PROFILE: monolith
      SM_CORRELATION_ENGINE_URL: http://correlation-engine:8009
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  simulation-service:
    profiles: ["detect"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_simulation_service"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: simulation-service
      SM_DEPLOYMENT_PROFILE: monolith
    ports:
      - "8011:8011"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8011/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  memory-service:
    profiles: ["detect"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_memory_service"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: memory-service
      SM_DEPLOYMENT_PROFILE: monolith
      SM_CORRELATION_ENGINE_URL: http://correlation-engine:8009
      SM_KAFKA_CONSUMER_GROUP: memory
    ports:
      - "8012:8012"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8012/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  reporting-service:
    profiles: ["detect"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_reporting_service"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: reporting-service
      SM_DEPLOYMENT_PROFILE: monolith
      SM_GRAPH_SERVICE_URL: http://graph-service:8004
      SM_MITRE_SERVICE_URL: http://mitre-service:8008
      SM_AI_ANALYST_URL: http://ai-analyst:8010
      SM_MEMORY_SERVICE_URL: http://memory-service:8012
    ports:
      - "8013:8013"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8013/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SM_KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      # Deliberately NOT setting KC_HOSTNAME=localhost here (tried during
      # Phase 18, reverted): it makes Keycloak advertise localhost:8080 in
      # its OWN discovery document's `issuer` field too, not just the
      # browser-facing authorization_endpoint -- which then fails every
      # service's (correct, intentional) check that the discovery
      # document's issuer matches SM_OIDC_ISSUER exactly. There is no way
      # to give Keycloak two different self-identities (one for the
      # container network, one for the browser) without either a reverse
      # proxy in front of it or a DNS name both sides resolve identically
      # -- neither of which this local compose file sets up. See
      # docs/architecture/demo-mode.md for the resulting, honestly
      # documented limitation: the interactive OIDC/SSO browser login is
      # NOT VERIFIED end-to-end in this topology; the local email/password
      # path (scripts/seed_demo.py) is.
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${SM_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # A second bind mount nested inside this one's target (e.g. at
      # .../dashboards/files) fails on Docker Desktop ("read-only file
      # system" creating the nested mountpoint) — the dashboard JSON lives
      # under provisioning/ itself instead, one mount, no nesting.
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # Attack graph + knowledge graph (Phase 4). Apply the schema after it is up:
  #   python scripts/graph_migrate.py      (or `make migrate`)
  neo4j:
    profiles: ["graph"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${SM_NEO4J_USER:-neo4j}/${SM_NEO4J_PASSWORD:-neo4j-dev-password}
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${SM_NEO4J_USER:-neo4j} -p ${SM_NEO4J_PASSWORD:-neo4j-dev-password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redpanda:
    profiles: ["bus"]
    image: redpandadata/redpanda:v24.2.11
    # Two listeners: INTERNAL for compose-network clients (advertised as
    # `redpanda:9092`), EXTERNAL for host clients / tests (advertised as
    # `localhost:19092`). A single listener advertising `redpanda:9092` is
    # unreachable from the host after the bootstrap metadata round-trip.
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092 | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  minio:
    profiles: ["objects"]
    # quay.io, not Docker Hub: MinIO's Docker Hub repo no longer serves this
    # (or any older) release tag to anonymous pulls ("pull access denied");
    # quay.io/minio/minio is MinIO's own mirror and still does, same digest.
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SM_S3_ACCESS_KEY_ID:-sentinelmesh}
      MINIO_ROOT_PASSWORD: ${SM_S3_SECRET_ACCESS_KEY:?SM_S3_SECRET_ACCESS_KEY must be set in .env}
      # MinIO needs a KMS backend before it will honor ANY server-side
      # encryption request (ADR-019), even plain SSE-S3 AES256 — unlike
      # real AWS S3, which supports AES256 with no KMS at all. This
      # fixed key enables MinIO's built-in single-key auto-encryption for
      # local dev / CI only; it protects nothing sensitive and is not an
      # application secret, so it is not `SM_`-prefixed / in `.env`.
