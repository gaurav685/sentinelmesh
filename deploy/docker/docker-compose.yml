# SentinelMesh local infrastructure.
#
# Run from the repository root:
#   docker compose -f deploy/docker/docker-compose.yml up -d
#
# Container-to-container addressing uses **service names**, never localhost.
# The values in `.env` target a developer's host (localhost) for running the app
# outside Docker; the `environment:` blocks below override the host-facing ones
# so the same `.env` works in both places.
#
# Profiles keep the default stack small:
#   (default)        postgres, redis, migrate, app, ingestion-gateway
#   --profile oidc   keycloak
#   --profile obs    prometheus, grafana
#   --profile graph  neo4j, graph-service   (Phase 4+; graph-service also needs --profile bus)
#   --profile bus    redpanda         (Phase 2+)
#   --profile detect ml-inference, detection-engine   (Phase 5+; detection-engine also needs --profile bus)
#   --profile objects minio           (Phase 5+)

name: sentinelmesh

x-app-env: &app-env
  # Service-name addressing for everything inside the compose network.
  SM_PG_HOST: postgres
  SM_PG_PORT: "5432"
  SM_REDIS_URL: redis://redis:6379/0
  SM_OIDC_ISSUER: http://keycloak:8080/realms/sentinelmesh
  SM_NEO4J_URI: bolt://neo4j:7687
  SM_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  SM_S3_ENDPOINT: http://minio:9000
  SM_OTEL_EXPORTER_OTLP_ENDPOINT: ""
  SM_SESSION_COOKIE_SECURE: "false"
  SM_CORS_ALLOWED_ORIGINS: http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SM_PG_DB:-sentinelmesh}
      POSTGRES_USER: ${SM_PG_USER:-sentinelmesh}
      POSTGRES_PASSWORD: ${SM_PG_PASSWORD:?SM_PG_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SM_PG_USER:-sentinelmesh} -d ${SM_PG_DB:-sentinelmesh}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: brings the schema to head, then exits. `app` waits for it to
  # succeed, so the service never starts against an older schema.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: migrations
    command:
      ["alembic", "-c", "/app/migrations/postgres/alembic.ini", "upgrade", "head"]
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: api-gateway
      SM_DEPLOYMENT_PROFILE: monolith
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ingestion-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_ingestion_gateway"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: ingestion-gateway
      SM_DEPLOYMENT_PROFILE: monolith
      # Off by default so the gateway runs without the `bus` profile. Set
      # SM_EVENT_BUS_ENABLED=true in .env (with `--profile bus`) to produce to
      # `telemetry.raw`; the in-network address is redpanda:9092 (x-app-env).
      SM_EVENT_BUS_ENABLED: ${SM_EVENT_BUS_ENABLED:-false}
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Stream processor: telemetry.raw -> events.canonical. Needs the `bus` profile
  # (Redpanda), so it only starts when that profile is active.
  # One-shot: create the topic catalog with the right partition counts before
  # any producer/consumer starts (Redpanda auto-create would give 1 partition).
  topics-init:
    profiles: ["bus"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "scripts/provision_topics.py"]
    working_dir: /app
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: topics-init
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy

  normalization-engine:
    profiles: ["bus"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_normalization_engine"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: normalization-engine
      SM_DEPLOYMENT_PROFILE: monolith
      SM_EVENT_BUS_ENABLED: "true"
      SM_KAFKA_CONSUMER_GROUP: normalization
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      redpanda:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully

  stream-processor:
    profiles: ["bus"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_stream_processor"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: stream-processor
      SM_DEPLOYMENT_PROFILE: monolith
      SM_EVENT_BUS_ENABLED: "true"
      SM_KAFKA_CONSUMER_GROUP: stream-processor
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8003/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      redpanda:
        condition: service_healthy
      topics-init:
        condition: service_completed_successfully

  # The only write path into Neo4j. Consumes graph.commands, emits graph.events.
  # Needs BOTH the bus and the graph store — run with `--profile bus --profile graph`.
  graph-service:
    profiles: ["graph"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_graph_service"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: graph-service
      SM_DEPLOYMENT_PROFILE: monolith
      SM_EVENT_BUS_ENABLED: "true"
      SM_KAFKA_CONSUMER_GROUP: graph-writer
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8004/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      neo4j:
        condition: service_healthy

  # Model serving (ADR-013). No trained artifacts ship in the repo, so every
  # infer call returns MODEL_UNAVAILABLE until ml-training produces one.
  ml-inference:
    profiles: ["detect"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_ml_inference"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: ml-inference
      SM_DEPLOYMENT_PROFILE: monolith
      SM_ML_MODEL_DIR: /app/ml/artifacts
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8005/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s

  # telemetry -> features -> anomaly -> evidence -> detection -> alert (reqs 5, 8).
  # Needs the bus, Postgres and (optionally) ml-inference:
  #   --profile bus --profile detect
  detection-engine:
    profiles: ["detect"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.app
    image: sentinelmesh/app:dev
    command: ["python", "-m", "sm_detection_engine"]
    env_file:
      - ../../.env
    environment:
      <<: *app-env
      SM_SERVICE_NAME: detection-engine
      SM_DEPLOYMENT_PROFILE: monolith
      SM_EVENT_BUS_ENABLED: "true"
      SM_KAFKA_CONSUMER_GROUP: detection
      SM_ML_INFERENCE_URL: http://ml-inference:8005
    ports:
      - "8006:8006"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8006/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  keycloak:
    profiles: ["oidc"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SM_KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"

  prometheus:
    profiles: ["obs"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: ["obs"]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${SM_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  # Attack graph + knowledge graph (Phase 4). Apply the schema after it is up:
  #   python scripts/graph_migrate.py      (or `make migrate`)
  neo4j:
    profiles: ["graph"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${SM_NEO4J_USER:-neo4j}/${SM_NEO4J_PASSWORD:-neo4j-dev-password}
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${SM_NEO4J_USER:-neo4j} -p ${SM_NEO4J_PASSWORD:-neo4j-dev-password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  redpanda:
    profiles: ["bus"]
    image: redpandadata/redpanda:v24.2.11
    # Two listeners: INTERNAL for compose-network clients (advertised as
    # `redpanda:9092`), EXTERNAL for host clients / tests (advertised as
    # `localhost:19092`). A single listener advertising `redpanda:9092` is
    # unreachable from the host after the bootstrap metadata round-trip.
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=localhost:9092 | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  minio:
    profiles: ["objects"]
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SM_S3_ACCESS_KEY_ID:-sentinelmesh}
      MINIO_ROOT_PASSWORD: ${SM_S3_SECRET_ACCESS_KEY:?SM_S3_SECRET_ACCESS_KEY must be set in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  neo4j-data:
  minio-data:
