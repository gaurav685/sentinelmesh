[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-api-gateway"
version = "0.1.0"
description = "SentinelMesh API gateway (BFF): the frontend's only backend. Authentication, deny-by-default RBAC, tenant-scoped reads, audit."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
    "sm-common",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    # Real dataset upload (Phase 18 follow-up): FastAPI's File/UploadFile
    # support requires this even though nothing imports it directly.
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_api_gateway"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
