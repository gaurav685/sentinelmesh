[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-simulation-service"
version = "0.1.0"
description = "SentinelMesh simulation + deception service (req 16/17/26/35): runs sm_ml's synthetic, deterministic attack scenarios against the digital-twin's synthetic environment (never a real system), optionally feeding the pipeline with clearly-labelled simulated telemetry, and hosts the deception decoy registry (isolated network boundaries only, teardown, audit)."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
    "sm-common",
    "sm-ml",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_simulation_service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
