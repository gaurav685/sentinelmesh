[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-mitre-service"
version = "0.1.0"
description = "SentinelMesh MITRE ATT&CK service (req 7): versioned technique/tactic catalog (imported offline from a STIX bundle), a rule-based technique-mapping engine, heatmap aggregates. Never claims coverage beyond the imported catalog."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
    "sm-common",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_mitre_service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
