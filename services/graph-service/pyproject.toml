[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-graph-service"
version = "0.1.0"
description = "SentinelMesh graph service: the only write path into Neo4j. Consumes graph.commands, applies each as a parameterized idempotent MERGE, emits graph.events. The read-query API (parameterized, tenant-scoped, depth-bounded) is Phase 4 Unit 3."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
    "sm-common",
    "sm-ml",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_graph_service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
