[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-memory-service"
version = "0.1.0"
description = "SentinelMesh threat memory (reqs 21, 37): behavioral-pattern persistence, campaign evolution, adversary fingerprinting, and pgvector-backed similarity search. Consumes confirmed attack chains; never duplicates the operational/knowledge graph or the detection/chain tables (ADR-011)."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
    "sm-common",
    "sm-ml",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_memory_service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
