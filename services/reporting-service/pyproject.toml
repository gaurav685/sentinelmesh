[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-reporting-service"
version = "0.1.0"
description = "SentinelMesh threat reporting (req 22): incident/executive/SOC/compliance report generation, grounded in evidence/inference/prediction/synthetic tiers, rendered to PDF and stored in S3-compatible object storage (ADR-019)."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
    "sm-common",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "reportlab>=4,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.21",
    "pypdf>=4,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_reporting_service"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
