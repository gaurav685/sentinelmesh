[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-ingestion-gateway"
version = "0.1.0"
description = "SentinelMesh ingestion gateway: authenticated sensor telemetry intake. Validates payloads, builds the canonical event envelope, hands accepted events to the raw-event sink and malformed ones to the DLQ."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
    "sm-common",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_ingestion_gateway"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
