[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-detection-engine"
version = "0.1.0"
description = "SentinelMesh detection engine (reqs 5, 8): telemetry -> features -> anomaly score -> evidence -> detection -> alert. System of record for detection / anomaly / threat_score / security_alert. Degrades to the statistical detector when ml-inference is unavailable (ADR-013). No detection capability is overclaimed; every detection is grounded in evidence."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
    "sm-common",
    "sm-ml",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_detection_engine"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
