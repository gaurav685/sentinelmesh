[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-stream-processor"
version = "0.1.0"
description = "SentinelMesh stream processor: stateless / low-state jobs over events.canonical. Phase 3 ships graph-update-emitter (canonical event -> graph.commands). Stateful jobs (windowed aggregation, sessionization) are a later engine (ADR-010)."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
    "sm-common",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_stream_processor"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
