[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sm-normalization-engine"
version = "0.1.0"
description = "SentinelMesh normalization engine: consumes telemetry.raw, maps each sensor payload to a canonical event, produces events.canonical. Deterministic mapping; enrichment providers are pluggable."
requires-python = ">=3.11"
dependencies = [
    "sm-contracts",
    "sm-common",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sm_normalization_engine"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
