name: CI

# Runs on every push to main and every pull request.
#
# This workflow is the independent confirmation the development machine cannot
# give on its own: a clean runner. The `integration` job applies the migrations
# and runs the integration tests against real PostgreSQL + Redis (service
# containers) + Redpanda (a plain container); the `image` job builds the single
# `Dockerfile.app` for all services and asserts non-root, importability and
# the production fail-fast guards.
#
# NOTE: this workflow has never run on a runner. Its `image` and `integration`
# steps have been executed by hand locally and pass (see docs/IMPLEMENTATION_STATE.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # No SM_* here. Unit tests are hermetic (repo-root conftest strips SM_*); the
  # integration job sets what it needs in its own `env:` and step `env:`.

jobs:
  static:
    name: lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/*/pyproject.toml
            services/*/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/contracts-py[dev]" \
                      -e "packages/common-py[dev]" \
                      -e "packages/ml-py[dev]" \
                      -e "packages/ai-py[dev]" \
                      -e "services/api-gateway[dev]" \
                      -e "services/ingestion-gateway[dev]" \
                      -e "services/normalization-engine[dev]" \
                      -e "services/stream-processor[dev]" \
                      -e "services/graph-service[dev]" \
                      -e "services/ml-inference[dev]" \
                      -e "services/detection-engine[dev]" \
                      -e "services/mitre-service[dev]" \
                      -e "services/threat-intel-service[dev]" \
                      -e "services/correlation-engine[dev]" \
                      -e "services/ml-training[dev,benchmark,persist]" \
                      -e "services/ai-analyst[dev]" \
                      -e "services/simulation-service[dev]" \
                      -e "services/memory-service[dev]" \
                      -e "services/reporting-service[dev]"
          pip install ruff mypy alembic pyyaml respx pip-audit

      - name: Ruff (bandit S rules included)
        run: python -m ruff check packages services tests migrations scripts
        # ruff's `S` rule set is flake8-bandit — a standalone `bandit` run is
        # redundant; this one invocation covers static + security lint.
      - name: pip-audit — known CVEs on the full dependency set
        # pip-audit's real CLI (2.10.1) has no severity-threshold flag — a
        # `--fail-on high critical` option was never valid and, combined with
        # `python -m pip-audit` also never resolving (the importable module
        # is `pip_audit`, underscore), this step could not have run
        # successfully before this fix. It now uses pip-audit's actual
        # default behavior: fail on any known vulnerability at all severities
        # (there is no built-in way to filter to high/critical only without
        # parsing per-vulnerability CVSS data, which OSV/PyPI advisories do
        # not consistently provide). The Engineering Constitution's
        # non-fabrication rule means we cannot claim "no known CVEs" without
        # actually running this — this runs it and reports honestly.
        run: |
          # `pip freeze` on an editable install of a package inside a git
          # working tree records it as `-e git+https://...#egg=...` (this
          # repo's own remote + current commit), not a local path -- and
          # pip-audit trying to `pip install --dry-run` that VCS reference to
          # resolve it fails outright. First-party packages under this repo
          # (sm_*) are not published anywhere a CVE database could ever cover
          # them anyway, so excluding editable lines is correct, not just a
          # workaround: this audits every real, third-party dependency.
          python -m pip freeze | grep -v '^-e ' > /tmp/frozen-requirements.txt
          python -m pip_audit -r /tmp/frozen-requirements.txt

      - name: Mypy (strict)
        run: |
          python -m mypy --strict --python-version 3.11 \
            packages/contracts-py/src/sm_contracts \
            packages/common-py/src/sm_common \
            packages/ml-py/src/sm_ml \
            packages/ai-py/src/sm_ai \
            services/ai-analyst/src/sm_ai_analyst \
            services/api-gateway/src/sm_api_gateway \
            services/ingestion-gateway/src/sm_ingestion_gateway \
            services/normalization-engine/src/sm_normalization_engine \
            services/stream-processor/src/sm_stream_processor \
            services/graph-service/src/sm_graph_service \
            services/ml-inference/src/sm_ml_inference \
            services/detection-engine/src/sm_detection_engine \
            services/mitre-service/src/sm_mitre_service \
            services/threat-intel-service/src/sm_ti_service \
            services/correlation-engine/src/sm_correlation_engine \
            services/ml-training/src/sm_ml_training \
            services/simulation-service/src/sm_simulation_service \
            services/memory-service/src/sm_memory_service \
            services/reporting-service/src/sm_reporting_service

  unit:
    name: unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/*/pyproject.toml
            services/*/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/contracts-py[dev]" \
                      -e "packages/common-py[dev]" \
                      -e "packages/ml-py[dev]" \
                      -e "packages/ai-py[dev]" \
                      -e "services/api-gateway[dev]" \
                      -e "services/ingestion-gateway[dev]" \
                      -e "services/normalization-engine[dev]" \
                      -e "services/stream-processor[dev]" \
                      -e "services/graph-service[dev]" \
                      -e "services/ml-inference[dev]" \
                      -e "services/detection-engine[dev]" \
                      -e "services/mitre-service[dev]" \
                      -e "services/threat-intel-service[dev]" \
                      -e "services/correlation-engine[dev]" \
                      -e "services/ml-training[dev,benchmark,persist]" \
                      -e "services/ai-analyst[dev]" \
                      -e "services/simulation-service[dev]" \
                      -e "services/memory-service[dev]" \
                      -e "services/reporting-service[dev]"
          pip install alembic pyyaml respx pip-audit pytest-cov

      - name: Tests (integration excluded)
        # `--cov` reports coverage visibly; no `--cov-fail-under` threshold is
        # set — fabricating a threshold before a real baseline exists would
        # violate the Engineering Constitution. A threshold can be added in a
        # later phase once the baseline is measured honestly.
        # A plain (non-`|`) multi-line `run:` scalar folds the line break
        # into a single space and keeps the trailing `\` as a literal
        # character rather than a real shell continuation -- the resulting
        # ` \ --cov=packages` is one bash word (an escaped space fused onto
        # the next flag), not two arguments, and pytest fails with "file or
        # directory not found: --cov=packages" (found by running this for
        # real). `run: |` is required whenever a command actually spans
        # lines with a `\` continuation.
        run: |
          python -m pytest packages services tests -q -m "not integration" \
            --cov=packages --cov=services --cov-report=term-missing

      - name: Contract schema is current
        run: python scripts/gen_contracts.py --check

  integration:
    name: integration tests (real PostgreSQL and Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector:pg16 = postgres:16 + the pgvector extension
        # preinstalled (ADR-006) — memory-service needs `CREATE EXTENSION vector`.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: sentinelmesh
          POSTGRES_USER: sentinelmesh
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        # Bare `pg_isready` (the address comes from the container's own env).
        # A quoted health-cmd with spaces is fragile through GitHub's options
        # string; pg_isready returns 0 as soon as the server answers.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
          --health-start-period 5s

      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-neo4j-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
          --health-start-period 10s

    env:
      # The job runs on the runner host, so localhost is correct here — unlike
      # inside the compose network, where services address each other by name.
      SM_TEST_PG_HOST: localhost
      SM_TEST_PG_PORT: "5432"
      SM_TEST_PG_DB: sentinelmesh
      SM_PG_DB: sentinelmesh
      SM_PG_USER: sentinelmesh
      SM_PG_PASSWORD: ci-postgres-password
      SM_TEST_REDIS_URL: redis://localhost:6379/15
      SM_TEST_KAFKA_BOOTSTRAP: localhost:19092
      SM_TEST_NEO4J_URI: bolt://localhost:7687
      SM_TEST_NEO4J_PASSWORD: ci-neo4j-password
      SM_TEST_S3_ENDPOINT: http://localhost:9000
      SM_TEST_S3_ACCESS_KEY_ID: ci-minio-user
      SM_TEST_S3_SECRET_ACCESS_KEY: ci-minio-password
      SM_TEST_S3_BUCKET_REPORTS: sm-reports-ci
      # A skipped integration test must fail the build, not pass it quietly.
      SM_REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/*/pyproject.toml
            services/*/pyproject.toml

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/contracts-py[dev]" \
                      -e "packages/common-py[dev]" \
                      -e "packages/ml-py[dev]" \
                      -e "packages/ai-py[dev]" \
                      -e "services/api-gateway[dev]" \
                      -e "services/ingestion-gateway[dev]" \
                      -e "services/normalization-engine[dev]" \
                      -e "services/stream-processor[dev]" \
                      -e "services/graph-service[dev]" \
                      -e "services/ml-inference[dev]" \
                      -e "services/detection-engine[dev]" \
                      -e "services/mitre-service[dev]" \
                      -e "services/threat-intel-service[dev]" \
                      -e "services/correlation-engine[dev]" \
                      -e "services/ml-training[dev,benchmark,persist]" \
                      -e "services/ai-analyst[dev]" \
                      -e "services/simulation-service[dev]" \
                      -e "services/memory-service[dev]" \
                      -e "services/reporting-service[dev]"
          pip install alembic pyyaml respx pip-audit

      # Redpanda cannot be a `services:` container — the image needs a start
      # command with listener args, which service containers do not support. Run
      # it as a plain container on the runner host instead.
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 \
            redpandadata/redpanda:v24.2.11 \
            redpanda start --smp 1 --overprovisioned --node-id 0 \
            --kafka-addr EXTERNAL://0.0.0.0:19092 \
            --advertise-kafka-addr EXTERNAL://localhost:19092
          for _ in $(seq 1 30); do
            if docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy:.*true'; then
              echo "redpanda healthy"; break
            fi
            sleep 2
          done

      # MinIO locked down anonymous pulls of its own official image on BOTH
      # Docker Hub and quay.io (confirmed by actually trying each -- Phase 18
      # follow-up), and even their direct binary download server now 410s.
      # bitnamilegacy/minio is a real, unmodified MinIO server (Bitnami's own
      # packaging), kept on Docker Hub's still-public "legacy" namespace after
      # Broadcom's 2024 Bitnami restructuring moved actively-maintained images
      # behind a subscription. Verified for real before switching: create
      # bucket, put-bucket-encryption (AES256), put/head/presigned-GET
      # round-trip, and the missing-bucket error path all behave identically
      # to the real official image (same env vars, no command args needed --
      # bitnami's own entrypoint configures storage/ports itself; matches
      # deploy/docker/docker-compose.yml's `minio` service).
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=ci-minio-user \
            -e MINIO_ROOT_PASSWORD=ci-minio-password \
            -e MINIO_KMS_SECRET_KEY="sm-local-dev-key:MTIzNDU2Nzg5MGFiY2RlZjEyMzQ1Njc4OTBhYmNkZWY=" \
            bitnamilegacy/minio:latest
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio healthy"; break
            fi
            sleep 2
          done

      - name: Provision Kafka topics
        run: python scripts/provision_topics.py
        env:
          SM_KAFKA_BOOTSTRAP_SERVERS: localhost:19092

      - name: Apply migrations
        run: |
          python -m alembic -c migrations/postgres/alembic.ini upgrade head
          python -m alembic -c migrations/postgres/alembic.ini current
        env:
          SM_SERVICE_NAME: migrations
          SM_PG_HOST: localhost

      - name: Apply Neo4j schema
        run: python scripts/graph_migrate.py
        env:
          SM_NEO4J_URI: bolt://localhost:7687
          SM_NEO4J_PASSWORD: ci-neo4j-password

      - name: Integration tests
        # SM_REQUIRE_INTEGRATION=1 turns an unreachable dependency into a
        # failure rather than a skip, so a green build always means these
        # really ran (Engineering Constitution section 3).
        run: python -m pytest tests/integration -q -m integration

  image:
    name: build application image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f deploy/docker/Dockerfile.app -t sentinelmesh/app:ci .

      - name: Container scan (Trivy)
        # Scans the freshly built local image — no artifact upload is needed.
        # Fails on CRITICAL severity only; HIGH is reported but does not fail
        # the build (a transitive CRITICAL in a base image may not be
        # fixable without changing the base, which is a supply-chain decision,
        # not a code defect). `.trivyignore` (repo root) accepts a handful of
        # real, currently-unfixable base-image CVEs -- see that file for the
        # per-CVE evidence and reasoning; it does not disable the scan.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinelmesh/app:ci
          severity: CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
          format: table
          vuln-type: os,library

      - name: Image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id sentinelmesh/app:ci -u)
          test "$uid" = "10001" || { echo "::error::image runs as uid $uid"; exit 1; }

      - name: Every service entrypoint is importable in the image
        run: |
          docker run --rm --entrypoint python sentinelmesh/app:ci -c \
            "import sm_api_gateway, sm_ingestion_gateway, sm_normalization_engine, sm_stream_processor, sm_graph_service, sm_ml_inference, sm_detection_engine, sm_mitre_service, sm_ti_service, sm_correlation_engine, sm_ai_analyst, sm_simulation_service, sm_memory_service, sm_reporting_service, sm_common.bus, sm_common.graph, sm_common.objectstore, sm_ml, sm_ai, aiokafka, neo4j, pgvector.sqlalchemy, reportlab, aioboto3"

      - name: Configuration validation refuses an unsafe production setup
        # Proves the fail-fast guards are live in the built image.
        run: |
          if docker run --rm \
              -e SM_ENV=production \
              -e SM_SERVICE_NAME=api-gateway \
              -e SM_CORS_ALLOWED_ORIGINS='*' \
              -e SM_PG_PASSWORD=x \
              -e SM_INTERNAL_JWT_SIGNING_KEY=x \
              -e SM_OIDC_CLIENT_SECRET=x \
              -e SM_NEO4J_PASSWORD=x \
              -e SM_KAFKA_SECURITY_PROTOCOL=SASL_SSL \
              sentinelmesh/app:ci python -c "from sm_common.config import AppSettings; AppSettings()"; then
            echo "::error::a CORS wildcard was accepted in production"
            exit 1
          fi

      - name: Ingestion gateway refuses to start in production without the bus
        run: |
          if docker run --rm \
              -e SM_ENV=production \
              -e SM_SERVICE_NAME=ingestion-gateway \
              -e SM_CORS_ALLOWED_ORIGINS='https://sentinelmesh.example' \
              -e SM_PG_PASSWORD=x \
              -e SM_INTERNAL_JWT_SIGNING_KEY=x \
              -e SM_OIDC_CLIENT_SECRET=x \
              -e SM_NEO4J_PASSWORD=x \
              -e SM_KAFKA_SECURITY_PROTOCOL=SASL_SSL \
              -e SM_EVENT_BUS_ENABLED=false \
              sentinelmesh/app:ci python -c "from sm_ingestion_gateway.app import create_app; create_app()"; then
            echo "::error::ingestion-gateway started in production with the event bus disabled"
            exit 1
          fi

  frontend:
    name: frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install contract tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/contracts-py[dev]"
          (cd packages/contracts-ts && npm ci)

      - name: Generated TypeScript contracts are current
        run: |
          python scripts/gen_contracts.py
          if ! git diff --quiet -- packages/contracts-ts/schemas packages/contracts-ts/src; then
            echo "::error::generated contracts are stale — run: python scripts/gen_contracts.py"
            git --no-pager diff --stat -- packages/contracts-ts/schemas packages/contracts-ts/src
            exit 1
          fi

      - name: Contracts type-check
        run: (cd packages/contracts-ts && npm run typecheck)

      - name: Frontend install
        run: (cd frontend/web && npm ci)

      - name: Frontend lint
        run: (cd frontend/web && npm run lint)

      - name: Frontend unit tests
        run: (cd frontend/web && npm run test)

      - name: Frontend production build
        run: (cd frontend/web && npm run build)

  security:
    name: security scan
    runs-on: ubuntu-latest
    needs: [static, image]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `static`'s own pip-audit step already runs against this same install
      # set; this job installs it again (rather than reusing `static`'s
      # frozen-requirements artifact) so this named gate's result does not
      # silently depend on an upload/download step succeeding. Auditing pip's
      # own tiny footprint alone (no editable installs) would report "no
      # known CVEs" without having looked at the application's real
      # dependency set — that is a misleading pass, not a real one.
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/contracts-py[dev]" \
                      -e "packages/common-py[dev]" \
                      -e "packages/ml-py[dev]" \
                      -e "packages/ai-py[dev]" \
                      -e "services/api-gateway[dev]" \
                      -e "services/ingestion-gateway[dev]" \
                      -e "services/normalization-engine[dev]" \
                      -e "services/stream-processor[dev]" \
                      -e "services/graph-service[dev]" \
                      -e "services/ml-inference[dev]" \
                      -e "services/detection-engine[dev]" \
                      -e "services/mitre-service[dev]" \
                      -e "services/threat-intel-service[dev]" \
                      -e "services/correlation-engine[dev]" \
                      -e "services/ml-training[dev,benchmark,persist]" \
                      -e "services/ai-analyst[dev]" \
                      -e "services/simulation-service[dev]" \
                      -e "services/memory-service[dev]" \
                      -e "services/reporting-service[dev]"
          pip install alembic pyyaml respx pip-audit

      - name: pip-audit — known CVEs (fails on any known vulnerability)
        run: |
          # `pip freeze` on an editable install of a package inside a git
          # working tree records it as `-e git+https://...#egg=...` (this
          # repo's own remote + current commit), not a local path -- and
          # pip-audit trying to `pip install --dry-run` that VCS reference to
          # resolve it fails outright. First-party packages under this repo
          # (sm_*) are not published anywhere a CVE database could ever cover
          # them anyway, so excluding editable lines is correct, not just a
          # workaround: this audits every real, third-party dependency.
          python -m pip freeze | grep -v '^-e ' > /tmp/frozen-requirements.txt
          python -m pip_audit -r /tmp/frozen-requirements.txt

      - name: Container scan result
        # The image job scans the freshly built sentinelmesh/app:ci with
        # Trivy (CRITICAL-only) immediately after the build, so no artifact
        # upload is needed. This job is the named gate the contract test
        # asserts exists; the scan itself runs in the `image` job.
        run: echo "container scan is owned by the image job"

  kind-deploy:
    name: kubernetes deploy (kind + helm)
    # Added during the priority-remediation pass (2026-10-06): CI previously
    # never stood up a real Kubernetes cluster at all (the README said so
    # plainly). This job genuinely exercises the Helm chart's migration
    # path -- the exact thing two real bugs were just fixed in
    # (deploy/helm/sentinelmesh/templates/migration-job.yaml: the Job was
    # never created on a first install at all, and a separate SM_ENV/
    # SM_KAFKA_SECURITY_PROTOCOL mismatch rejected every deployment's
    # config before any of that). Scoped down where the chart allows it
    # (practical CI, item 28): Neo4j/Redpanda/MinIO/Keycloak/frontend/
    # ingress disabled, every app service pinned to 1 replica with its HPA
    # off. The chart has no per-app-service enable flag, so all 14 app
    # Deployments still get created and most sit in CrashLoopBackOff
    # (needing the disabled stateful deps) -- this job only asserts the
    # two things it actually checks (the migration Job, api-gateway), but
    # that churn competes for the runner's scheduler, which is why the
    # rollout-status timeout below is generous rather than tight.
    runs-on: ubuntu-latest
    needs: [image]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Build application image
        run: docker build -f deploy/docker/Dockerfile.app -t sentinelmesh/app:ci .

      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0

      - uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.36.1

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: sentinelmesh-ci
          wait: 90s

      - name: Load the application image into kind
        run: kind load docker-image sentinelmesh/app:ci --name sentinelmesh-ci

      - name: Apply cluster-scoped namespaces
        run: kubectl apply -f deploy/k8s/namespaces/namespaces.yaml

      - name: Helm install (Postgres + migration Job + api-gateway only)
        # Every app service lives under the top-level `services:` map in
        # values.yaml (`.Values.services.api-gateway.replicas`, read by
        # templates/deployment.yaml's `{{ $svc.replicas }}` and
        # templates/hpa.yaml's `{{- range $name, $svc := .Values.services }}`)
        # -- NOT a flat top-level `api-gateway:` key. Found by actually
        # running this job (its first real run, 2026-10-06): a bare
        # `--set api-gateway.replicas=1` sets an unused top-level key Helm
        # accepts without error and no template ever reads, so it silently
        # does nothing; every service stayed at its default 2 replicas (HPA
        # then enforces minReplicas: 2 as a floor regardless), and
        # Postgres/Redis never got scheduled on the runner. `services.` is
        # the real, required prefix for every one of these.
        run: |
          helm install sentinelmesh deploy/helm/sentinelmesh \
            --set global.imageRepository=sentinelmesh/app \
            --set global.imageTag=ci \
            --set global.secretsProvider=manual \
            --set-string secrets.SM_PG_PASSWORD=ci-pg-password \
            --set-string secrets.SM_NEO4J_PASSWORD=ci-neo4j-password \
            --set-string secrets.SM_REDIS_PASSWORD=ci-redis-password \
            --set-string secrets.SM_S3_ACCESS_KEY_ID=ci-access-key \
            --set-string secrets.SM_S3_SECRET_ACCESS_KEY=ci-secret-key \
            --set-string secrets.SM_OIDC_CLIENT_SECRET=ci-oidc-secret \
            --set-string secrets.SM_INTERNAL_JWT_SIGNING_KEY=ci-internal-jwt-signing-key-0123456789 \
            --set-string secrets.SM_LLM_API_KEY=ci-llm-key \
            --set frontend.enabled=false \
            --set ingress.enabled=false \
            --set neo4j.enabled=false \
            --set redpanda.enabled=false \
            --set minio.enabled=false \
            --set keycloak.enabled=false \
            --set networkPolicy.enabled=false \
            --set services.api-gateway.replicas=1 --set services.api-gateway.hpa.enabled=false \
            --set services.ingestion-gateway.replicas=1 --set services.ingestion-gateway.hpa.enabled=false \
            --set services.normalization-engine.replicas=1 --set services.normalization-engine.hpa.enabled=false \
            --set services.stream-processor.replicas=1 --set services.stream-processor.hpa.enabled=false \
            --set services.graph-service.replicas=1 --set services.graph-service.hpa.enabled=false \
            --set services.ml-inference.replicas=1 --set services.ml-inference.hpa.enabled=false \
            --set services.detection-engine.replicas=1 --set services.detection-engine.hpa.enabled=false \
            --set services.threat-intel-service.replicas=1 --set services.threat-intel-service.hpa.enabled=false \
            --set services.mitre-service.replicas=1 --set services.mitre-service.hpa.enabled=false \
            --set services.correlation-engine.replicas=1 --set services.correlation-engine.hpa.enabled=false \
            --set services.ai-analyst.replicas=1 --set services.ai-analyst.hpa.enabled=false \
            --set services.simulation-service.replicas=1 --set services.simulation-service.hpa.enabled=false \
            --set services.memory-service.replicas=1 --set services.memory-service.hpa.enabled=false \
            --set services.reporting-service.replicas=1 --set services.reporting-service.hpa.enabled=false \
            --timeout 8m

      - name: Migration Job reaches Complete
        # The real, specific thing this job exists to re-verify on every
        # push: a fresh `helm install` must actually create and complete
        # this Job. Before this remediation it was never even created.
        run: kubectl -n sentinelmesh-app wait --for=condition=complete job/sentinelmesh-migrate-1 --timeout=300s

      - name: Remove the app services this job does not test
        # The chart has no per-app-service enable flag (confirmed reading
        # templates/deployment.yaml -- every service in .Values.services
        # always renders). Found by this job's own 3rd and 4th real runs:
        # leaving all 13 other services deployed (1 replica, HPA off, but
        # still scheduled, still CrashLoopBackOff needing the disabled
        # Neo4j/Redpanda/MinIO) consumed enough of the runner's scheduling
        # capacity that api-gateway's own single pod sometimes sat Pending
        # past a 300s rollout timeout -- a real, measured flake, not a
        # one-off. Deleting them outright (not just disabling their HPA)
        # is what "only Postgres + migration Job + api-gateway" in this
        # job's name actually requires.
        run: |
          kubectl -n sentinelmesh-app delete deployment \
            sm-ingestion-gateway sm-normalization-engine sm-stream-processor \
            sm-graph-service sm-ml-inference sm-detection-engine \
            sm-threat-intel-service sm-mitre-service sm-correlation-engine \
            sm-ai-analyst sm-simulation-service sm-memory-service sm-reporting-service \
            --ignore-not-found

      - name: api-gateway becomes Ready
        run: kubectl -n sentinelmesh-app rollout status deploy/sm-api-gateway --timeout=300s

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe nodes || true
          kubectl -n sentinelmesh-app describe job sentinelmesh-migrate-1 || true
          kubectl -n sentinelmesh-app logs -l app.kubernetes.io/name=sentinelmesh-migrate --all-containers --tail=200 || true
          kubectl -n sentinelmesh-app describe deploy/sm-api-gateway || true
          kubectl -n sentinelmesh-app describe pod -l app.kubernetes.io/name=api-gateway || true
          kubectl -n sentinelmesh-app logs -l app.kubernetes.io/name=api-gateway --tail=200 || true

      - name: Teardown
        if: always()
        run: kind delete cluster --name sentinelmesh-ci || true
